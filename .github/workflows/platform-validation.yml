name: NoSQL Mongo kernel compatibility validation

# Isolated test branch only. Does not alter the released course branch.
on:
  push:
    branches: [test/mongo-kernel-20261102]

permissions:
  contents: read

jobs:
  native-arm64:
    name: Native ARM64 Mongo compatibility and practice queries
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Assert native ARM64 host and record kernel
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = aarch64
          uname -srm
          docker version
          docker compose version
          sha256sum compose.yaml
      - name: Test exact candidate, allocator mode, 90-second workload, and 17 notebook queries
        run: python3 tests/platform_smoke.py --kit . --fixtures tests/query_cases.json --output-dir qa_results/arm64 --expected-arch arm64
      - name: Summarize validation
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("qa_results/arm64/platform_report.json")
          if p.exists():
              r = json.loads(p.read_text())
              print(json.dumps({k: r.get(k) for k in ("status", "host", "bash_uname", "kit_sha256", "executed_images", "kernel_compatibility_workload", "limitations")}, indent=2))
              print("Checks passed:", sum(c["pass"] for c in r["checks"]), "/", len(r["checks"]))
              print("Queries passed:", sum(c["pass"] for c in r["query_results"]), "/", len(r["query_results"]))
          PY
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-arm64-kernel-results
          path: qa_results/arm64/
          retention-days: 7
          if-no-files-found: warn

